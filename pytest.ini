[pytest]
pythonpath = .
testpaths = tests
markers =
    api: API-only tests (fast, no browser)
    ui: UI tests (need a browser)
    cross_layer: compare layers (simulator vs API vs UI)
    oem_email: semi-automatic -- sends one email to the OEM test mailbox and asks for the decision link copied from it (needs OEM_EMAIL_TESTS=1)
    local_fractal_sim: needs a real Fractal simulator+proxy+edge stack running locally
        (see docs/FRACTAL_ALARM_INJECTION_SETUP.md) -- not runnable in CI
